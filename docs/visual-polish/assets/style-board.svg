<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Sân Mây style board</title><desc id="desc">Schematic palette and panel treatment using shared CSS tokens.</desc>
<rect width="960" height="540" rx="26" fill="#102625"/><text x="52" y="66" fill="#f4e8d0" font-family="Segoe UI,Arial" font-size="28" font-weight="600">SÂN MÂY · VISUAL LANGUAGE</text><text x="52" y="98" fill="#c4cfbd" font-family="Segoe UI,Arial" font-size="15">Warm timber · quiet foliage · aged brass · deep teal</text>
<g font-family="Segoe UI,Arial" font-size="14" fill="#f4e8d0"><rect x="52" y="132" width="118" height="82" rx="14" fill="#f4e8d0"/><text x="52" y="238">Paper</text><rect x="190" y="132" width="118" height="82" rx="14" fill="#8b5e3c"/><text x="190" y="238">Timber</text><rect x="328" y="132" width="118" height="82" rx="14" fill="#b65e45"/><text x="328" y="238">Terracotta</text><rect x="466" y="132" width="118" height="82" rx="14" fill="#58765b"/><text x="466" y="238">Foliage</text><rect x="604" y="132" width="118" height="82" rx="14" fill="#c7a76c"/><text x="604" y="238">Brass</text><rect x="742" y="132" width="166" height="82" rx="14" fill="#183330" stroke="#c4bb88"/><text x="742" y="238">Deep teal</text></g>
<rect x="52" y="282" width="856" height="210" rx="22" fill="#102625eb" stroke="#c4bb8844"/><text x="84" y="326" fill="#c7a76c" font-family="Georgia,serif" font-size="21">Bảng tương tác</text><text x="84" y="356" fill="#f4e8d0" font-family="Segoe UI,Arial" font-size="16">Chậm rãi, rõ ràng, trang trọng. Giữ nội dung dễ đọc.</text><rect x="84" y="392" width="158" height="52" rx="12" fill="#58765b" stroke="#c7a76c"/><text x="163" y="424" text-anchor="middle" fill="#f4e8d0" font-family="Segoe UI,Arial" font-size="16">Tiếp tục</text><text x="272" y="423" fill="#c4cfbd" font-family="Segoe UI,Arial" font-size="14">Bo góc vừa phải · khoảng thở · tương phản dịu</text>
</svg>
